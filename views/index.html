<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href = "bootstrap.min.css" rel="stylesheet" />
    <link href="styles.css" rel="stylesheet" />
    <title>Document</title>
</head>
<body>
    <div id = "sidebar" class = "flex flex-column h-100 py-3 bg-dark text-white" style = "height: 100vh; width: 15vw; font-size: 1.5rem;">
        <div class = "mb-5">
            <h1 class = "px-3"><a class = "nav-link" href = "/">Mangie</a></h1>
        </div>
        <ul class = "nav nav-pills flex flex-column mb-auto">
            <li><a class = "nav-link link-light" href = "/backlog">Product backlog</a></li>
            <li><a class = "nav-link link-light" href = "/board">Sprint Board</a></li>
            <li><a class = "nav-link link-light" href = "/sprint_list">Sprint List</a></li>
            <li><a class = "nav-link link-light" href = "/task_view">Task view</a></li>
        </ul>
    </div>

    <div class = "flex flex-column p-3 rounded-3" style = "width: 85vw;">
        <h1 class = "mb-5">Active Sprint Boards</h1>
        <div class = "card">
            <div class = "card-body">
                <h1 class = "card-title">This is a sprint</h1>
                <p class = "card-text">iudgfousihuos</p>
                <a href="#" class="btn btn-primary">Go to Sprint ></a>
            </div>
        </div>
        <!-- Delete User Section -->
        <div class="card mt-4">
            <div class="card-body">
                <h2 class="card-title">Manage Users</h2>
                <form id="deleteUserForm" method="POST">
                    <div class="mb-3">
                        <label for="projectId" class="form-label">Project ID:</label>
                        <input type="text" id="projectId" name="projectId" class="form-control" placeholder="Enter Project ID" required />
                    </div>

                    <div class="mb-3">
                        <label for="userId" class="form-label">User ID to Delete:</label>
                        <input type="text" id="userId" name="userId" class="form-control" placeholder="Enter User ID" required />
                    </div>

                    <button type="button" class="btn btn-danger" onclick="submitForm()">Delete User</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function submitForm() {
            var projectId = document.getElementById('projectId').value;
            var userId = document.getElementById('userId').value;

            // Set form action dynamically
            var form = document.getElementById('deleteUserForm');
            form.action = `/projects/${projectId}/users/${userId}`;
            form.method = 'POST';

            // Add hidden input fields for CSRF token and method spoofing to simulate DELETE
            var csrfInput = document.createElement('input');
            csrfInput.type = 'hidden';
            csrfInput.name = '_token'; // CSRF token name for Laravel
            csrfInput.value = '{{ csrf_token() }}'; // Laravel automatically generates a CSRF token

            var methodInput = document.createElement('input');
            methodInput.type = 'hidden';
            methodInput.name = '_method'; // Method spoofing for DELETE
            methodInput.value = 'DELETE';

            form.appendChild(csrfInput);
            form.appendChild(methodInput);

            // Submit the form
            form.submit();
        }
    </script>
    

</body>
</html>
